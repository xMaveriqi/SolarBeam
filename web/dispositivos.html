<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solar Beam | Dispositivos</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
</head>

<body>
    <div class="dashboard-container">

        <aside class="sidebar" id="sidebar">
            <div>
                <div class="sidebar-logo">
                    <div class="logo">
                        <button id="toggleSidebar" class="logo-icon" aria-label="Abrir ou fechar menu">
                            <i class="fa-solid fa-sun"></i>
                        </button>
                        <h2>Solar <span>Beam</span></h2>
                    </div>
                </div>

                <nav>
                    <ul>
                        <li class="active">
                            <a href="dispositivos.html">
                                <i class="fa-solid fa-microchip"></i>
                                <span>Meus Dispositivos</span>
                            </a>
                        </li>
                    </ul>
                </nav>
            </div>

            <div class="sidebar-footer">
                <a href="index.html">
                    <i class="fa-solid fa-right-from-bracket"></i>
                    <span>Sair</span>
                </a>
            </div>
        </aside>

        <main class="main-content">
            <header class="topbar">
                <div>
                    <h1>Meus Dispositivos</h1>
                    <p>Conecte e gerencie seus ESP32</p>
                </div>
                <div class="topbar-right">
                    <div class="user-info">
                        <div class="user-avatar">
                            <i class="fa-solid fa-user"></i>
                        </div>
                        <div>
                            <b>Usuário</b>
                            <small>Online</small>
                        </div>
                    </div>
                </div>
            </header>

            <section class="dashboard-grid">

                <article class="panel">
                    <div class="panel-header">
                        <h2>Adicionar Novo ESP</h2>
                    </div>
                    <form id="novoDispositivoForm" class="simulador-form">
                        <div class="simulador-campo" style="grid-column: 1 / -1;">
                            <label for="nomeDispositivo">Nome do dispositivo</label>
                            <input type="text" id="nomeDispositivo" placeholder="Ex: Horta dos fundos" required>
                        </div>
                        <button type="submit" id="btnAdicionarDispositivo">
                            <i class="fa-solid fa-plus"></i>
                            Adicionar ESP
                        </button>
                    </form>
                    <p id="dispositivoMensagem" class="simulador-mensagem"></p>
                    <div id="codigoGerado" style="display:none; margin-top: 14px; padding: 14px; border-radius: 10px; background: rgba(34,197,94,0.08); border: 1px solid rgba(34,197,94,0.25);">
                        <p style="font-size: 13px; color: var(--text-secondary); margin-bottom: 6px;">Código do dispositivo (grave no firmware do ESP32):</p>
                        <code id="codigoTexto" style="font-size: 16px; font-weight: 600; color: var(--solar-green);"></code>
                    </div>
                </article>

                <article class="panel">
                    <div class="panel-header">
                        <h2>Dispositivos Conectados</h2>
                    </div>
                    <div id="listaDispositivos">
                        <p style="color: var(--text-secondary); font-size: 13px;">Carregando...</p>
                    </div>
                </article>

            </section>
        </main>
    </div>

    <script src="js/config.js"></script>
    <script src="js/auth-guard.js"></script>
    <script src="js/sidebar.js"></script>
    <script src="js/dispositivos.js"></script>
</body>
</html>
